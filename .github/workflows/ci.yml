name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("SKILL.md").read_text(encoding="utf-8")
          assert text.startswith("---\n")
          assert "name: resume-ai-content-review" in text.split("---", 2)[1]
          assert Path("LICENSE").is_file()
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Exercise source-text analysis
        run: python scripts/analyze_resume.py tests/fixtures/synthetic_resume.md --format json > /tmp/resume-features.json
      - name: Validate example report
        run: python scripts/validate_review.py tests/fixtures/valid-review.json
