<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">不要猜 AI 百分比</title>
  <desc id="desc">将不可靠的 AI 百分比判断改写为基于证据的核验问题，最终由人类作出招聘决定。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="96" y="92" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="34" font-weight="700">不要猜 AI 百分比</text>
  <text x="96" y="126" fill="#666666" font-family="Inter, PingFang SC, sans-serif" font-size="16">把不确定性转成可以验证的问题</text>

  <line x1="96" y1="538" x2="1104" y2="538" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="328" y1="337" x2="516" y2="337" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="684" y1="337" x2="866" y2="337" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="232" cy="337" r="96" fill="none" stroke="#B8B8B8" stroke-width="1.5"/>
  <circle cx="232" cy="337" r="70" fill="#F5F5F5" stroke="#E8E8E8"/>
  <path d="M181 286 L283 388 M283 286 L181 388" stroke="#999999" stroke-width="2"/>
  <text x="232" y="330" text-anchor="middle" fill="#666666" font-family="Inter, PingFang SC, sans-serif" font-size="30" font-weight="700">73%?</text>
  <text x="232" y="365" text-anchor="middle" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="14">伪精确</text>
  <text x="232" y="470" text-anchor="middle" fill="#666666" font-family="Inter, PingFang SC, sans-serif" font-size="15">猜作者来源</text>

  <path d="M516 337 C548 250 652 250 684 337 C652 424 548 424 516 337 Z" fill="none" stroke="#B8B8B8" stroke-width="1" stroke-dasharray="6 6"/>
  <circle cx="600" cy="337" r="5" fill="#2F6BFF"/>
  <line x1="600" y1="286" x2="600" y2="388" stroke="#E8E8E8"/>
  <line x1="549" y1="337" x2="651" y2="337" stroke="#E8E8E8"/>
  <text x="600" y="322" text-anchor="middle" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="17" font-weight="600">承认不确定</text>
  <text x="600" y="355" text-anchor="middle" fill="#666666" font-family="Inter, PingFang SC, sans-serif" font-size="13">误报 · 改写 · 语言偏差</text>

  <circle cx="960" cy="337" r="104" fill="none" stroke="#2F6BFF" stroke-width="1.5"/>
  <circle cx="960" cy="337" r="72" fill="none" stroke="#E8E8E8" stroke-width="1"/>
  <circle cx="960" cy="337" r="10" fill="#2F6BFF"/>
  <text x="960" y="320" text-anchor="middle" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="21" font-weight="700">问事实</text>
  <text x="960" y="370" text-anchor="middle" fill="#666666" font-family="Inter, PingFang SC, sans-serif" font-size="14">人类最终判断</text>
  <text x="960" y="470" text-anchor="middle" fill="#2F6BFF" font-family="Inter, PingFang SC, sans-serif" font-size="15" font-weight="600">核验经历与贡献</text>

  <text x="96" y="590" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="12">简历 AI 含量识别 · Evidence over guesswork</text>
</svg>
