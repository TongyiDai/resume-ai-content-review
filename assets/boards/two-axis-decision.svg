<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI 介入线索与内容核验风险双轴矩阵</title>
  <desc id="desc">AI 介入线索高低与内容核验风险高低形成四种不同招聘行动。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#222222"/></marker></defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <g font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="96" y="84" font-size="34" font-weight="700" fill="#111111">AI 线索高，不等于内容风险高</text>
    <text x="96" y="120" font-size="16" fill="#666666">拆成两个轴，HR 才知道该忽略、常规评审，还是进一步核验</text>

    <rect x="238" y="170" width="760" height="390" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
    <rect x="618" y="170" width="380" height="195" fill="#F3F6FF"/>
    <line x1="618" y1="170" x2="618" y2="560" stroke="#B8B8B8"/>
    <line x1="238" y1="365" x2="998" y2="365" stroke="#B8B8B8"/>

    <line x1="238" y1="584" x2="1022" y2="584" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="214" y1="560" x2="214" y2="146" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="618" y="632" text-anchor="middle" font-size="18" font-weight="600" fill="#111111">AI 介入线索 →</text>
    <text x="112" y="365" text-anchor="middle" font-size="18" font-weight="600" fill="#111111" transform="rotate(-90 112 365)">内容核验风险 →</text>
    <text x="238" y="608" font-size="12" fill="#999999">有限</text>
    <text x="962" y="608" font-size="12" fill="#999999">集中</text>
    <text x="188" y="558" text-anchor="end" font-size="12" fill="#999999">低</text>
    <text x="188" y="178" text-anchor="end" font-size="12" fill="#999999">高</text>

    <g>
      <circle cx="430" cy="458" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
      <text x="430" y="493" text-anchor="middle" font-size="20" font-weight="600" fill="#111111">常规评审</text>
      <text x="430" y="518" text-anchor="middle" font-size="13" fill="#666666">不额外追问 AI</text>
    </g>
    <g>
      <circle cx="806" cy="458" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
      <text x="806" y="493" text-anchor="middle" font-size="20" font-weight="600" fill="#111111">视为表达辅助</text>
      <text x="806" y="518" text-anchor="middle" font-size="13" fill="#666666">不采取不利行动</text>
    </g>
    <g>
      <circle cx="430" cy="266" r="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
      <text x="430" y="301" text-anchor="middle" font-size="20" font-weight="600" fill="#111111">核验关键内容</text>
      <text x="430" y="326" text-anchor="middle" font-size="13" fill="#666666">问题在证据，不在 AI</text>
    </g>
    <g>
      <circle cx="806" cy="266" r="48" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="2"/>
      <circle cx="806" cy="266" r="7" fill="#2F6BFF"/>
      <text x="806" y="331" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">重点核验</text>
      <text x="806" y="351" text-anchor="middle" font-size="12" fill="#666666">人工复核后再决策</text>
    </g>
  </g>
</svg>
