<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从原文证据到核验问题</title>
  <desc id="desc">简历原文依次经过分层信号、替代解释和结构化问题，最终交给人类复核。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#222222"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6BFF"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#FFFFFF"/>
  <text x="96" y="92" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="34" font-weight="700">从原文证据到核验问题</text>
  <text x="96" y="126" fill="#666666" font-family="Inter, PingFang SC, sans-serif" font-size="16">每一步都保留不确定性，不越过证据边界</text>

  <line x1="152" y1="342" x2="1048" y2="342" stroke="#E8E8E8" stroke-width="1"/>
  <line x1="202" y1="342" x2="372" y2="342" stroke="#222222" marker-end="url(#arrow)"/>
  <line x1="422" y1="342" x2="572" y2="342" stroke="#222222" marker-end="url(#arrow)"/>
  <line x1="622" y1="342" x2="772" y2="342" stroke="#2F6BFF" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="822" y1="342" x2="972" y2="342" stroke="#222222" marker-end="url(#arrow)"/>

  <circle cx="177" cy="342" r="25" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <circle cx="397" cy="342" r="25" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <circle cx="597" cy="342" r="25" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
  <circle cx="797" cy="342" r="41" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1.5"/>
  <circle cx="797" cy="342" r="7" fill="#2F6BFF"/>
  <circle cx="997" cy="342" r="25" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>

  <text x="177" y="272" text-anchor="middle" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="600">简历原文</text>
  <text x="177" y="438" text-anchor="middle" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="13">只引用事实</text>
  <text x="397" y="272" text-anchor="middle" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="600">分层信号</text>
  <text x="397" y="438" text-anchor="middle" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="13">E1 · E2 · E3</text>
  <text x="597" y="272" text-anchor="middle" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="600">替代解释</text>
  <text x="597" y="438" text-anchor="middle" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="13">主动找反证</text>
  <text x="797" y="254" text-anchor="middle" fill="#2F6BFF" font-family="Inter, PingFang SC, sans-serif" font-size="19" font-weight="700">结构化问题</text>
  <text x="797" y="438" text-anchor="middle" fill="#2F6BFF" font-family="Inter, PingFang SC, sans-serif" font-size="13" font-weight="600">情境 · 所有权 · 结果</text>
  <text x="997" y="272" text-anchor="middle" fill="#111111" font-family="Inter, PingFang SC, sans-serif" font-size="18" font-weight="600">人类复核</text>
  <text x="997" y="438" text-anchor="middle" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="13">最终决定</text>

  <path d="M597 317 C620 210 770 190 797 295" fill="none" stroke="#B8B8B8" stroke-dasharray="5 6"/>
  <text x="695" y="207" text-anchor="middle" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="12">不能排除，就转成问题</text>

  <text x="96" y="590" fill="#999999" font-family="Inter, PingFang SC, sans-serif" font-size="12">同一岗位使用一致的问题框架，避免凭“AI 味”区别对待</text>
</svg>
